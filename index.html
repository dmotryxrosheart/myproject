<!DOCTYPE html>
<html>
<head>
<title>DMO Shop</title>
</head>

<body>

<h1>DMO Shop</h1>

<h2>Products</h2>

<p>Black T-Shirt - 299฿</p>
<button onclick="addItem(299)">Buy</button>

<p>Cap - 199฿</p>
<button onclick="addItem(199)">Buy</button>

<h2>Cart</h2>

<p>Total: <span id="total">0</span> ฿</p>

<h2>Customer Info</h2>

<input placeholder="Your name"><br><br>
<textarea placeholder="Address"></textarea><br><br>

<button onclick="order()">Order</button>

<script>

let total = 0;

function addItem(price){
 total += price;
 document.getElementById("total").innerText = total;
}

function order(){
 alert("Order received. Please send payment slip via LINE.");
}

</script>

</body>
</html>
