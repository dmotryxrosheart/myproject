<!DOCTYPE html>
<html>
<head>
<title>DMO Shop</title>

<style>

body{
font-family: Arial;
background:#f5f5f5;
text-align:center;
}

h1{
background:black;
color:white;
padding:20px;
}

.products{
display:flex;
justify-content:center;
gap:20px;
margin-top:30px;
}

.card{
background:white;
padding:20px;
width:200px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card img{
width:100%;
border-radius:10px;
}

button{
background:black;
color:white;
border:none;
padding:10px;
margin-top:10px;
cursor:pointer;
border-radius:5px;
}

.cart{
margin-top:40px;
font-size:20px;
}

.order{
margin-top:20px;
}

</style>

</head>

<body>

<h1>DMO Shop</h1>

<div class="products">

<div class="card">
<img src="https://picsum.photos/200?1">
<h3>Black T-Shirt</h3>
<p>299฿</p>
<button onclick="addItem(299)">Add to Cart</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?2">
<h3>Cap</h3>
<p>199฿</p>
<button onclick="addItem(199)">Add to Cart</button>
</div>

</div>

<div class="cart">
Total: <span id="total">0</span> ฿
</div>

<div class="order">

<input id="name" placeholder="Your name"><br><br>

<textarea id="address" placeholder="Address"></textarea><br><br>

<button onclick="sendOrder()">Order via LINE</button>

</div>

<script>

let total = 0;

function addItem(price){
total += price;
document.getElementById("total").innerText = total;
}

function sendOrder(){

let name = document.getElementById("name").value;
let address = document.getElementById("address").value;

let message = `Order from ${name}
Total: ${total}฿
Address: ${address}`;

let lineURL = "https://line.me/R/msg/text/?" + encodeURIComponent(message);

window.open(lineURL);

}

</script>

</body>
</html>
